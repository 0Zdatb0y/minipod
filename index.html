<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniPod Simulator v2</title>
<style>
:root{--bg:#14161c;--panel:#1d2029;--line:#2c303c;--text:#e8eaf0;--muted:#8a90a0;--accent:#5bd0ff;
--shell:#ececf1;--shell2:#c8c9d2;--wheel:#f8f8fb;--wheelText:#9a9caa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 16px;min-height:100vh}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px;text-align:center}
.sub a{color:var(--accent)}
.wrap{display:flex;gap:32px;flex-wrap:wrap;justify-content:center;align-items:flex-start;max-width:940px;width:100%}
.device{width:300px;max-width:100%;background:linear-gradient(160deg,var(--shell),var(--shell2));border-radius:30px;padding:22px 20px 24px;box-shadow:0 24px 60px #000a,inset 0 2px 0 #fff5,inset 0 -3px 0 #0003;position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation;margin-top:26px}
.jack{position:absolute;top:-8px;left:46px;width:20px;height:10px;background:#1a1a1a;border-radius:4px 4px 0 0}
.jack span{position:absolute;top:-20px;left:-8px;font-size:10px;color:var(--muted);white-space:nowrap}
.plug{position:absolute;left:6px;bottom:8px;width:8px;height:0;background:#333;border-radius:3px 3px 0 0;transition:height .2s}
.jack.on .plug{height:36px}
.usb{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:34px;height:6px;background:#222;border-radius:0 0 4px 4px}
.power{position:absolute;right:-7px;top:74px;width:9px;height:46px;background:#777;border-radius:0 5px 5px 0;cursor:pointer;border:none;padding:0}
.power:active{background:#555}
.powerLbl{position:absolute;right:-44px;top:88px;font-size:10px;color:var(--muted)}
.screenWrap{background:#05070a;border-radius:10px;padding:10px;box-shadow:inset 0 0 0 3px #0008,0 1px 0 #fff4}
canvas#scr{width:100%;display:block;aspect-ratio:3/4;background:#000;border-radius:2px;image-rendering:pixelated}
.brand{text-align:center;font-size:11px;letter-spacing:3px;color:#0006;margin:12px 0 10px;font-weight:800;text-transform:uppercase;min-height:14px}
.menuBtn{display:block;margin:0 auto 12px;border:none;background:var(--wheel);color:var(--wheelText);font-weight:800;font-size:11px;letter-spacing:2px;padding:7px 18px;border-radius:20px;cursor:pointer;box-shadow:0 2px 4px #0003}
.wheel{position:relative;width:180px;height:180px;margin:0 auto;border-radius:50%;background:var(--wheel);box-shadow:inset 0 2px 6px #0002,0 1px 0 #fff8}
.btn{position:absolute;border:none;background:transparent;color:var(--wheelText);font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;border-radius:14px;padding:0}
.btn.pressed,.menuBtn.pressed{color:#222;background:#0002}
.up{top:6px;left:62px;width:56px;height:46px}.down{bottom:6px;left:62px;width:56px;height:46px}
.left{left:6px;top:62px;width:46px;height:56px}.right{right:6px;top:62px;width:46px;height:56px}
.ok{left:58px;top:58px;width:64px;height:64px;border-radius:50%;background:linear-gradient(160deg,var(--shell),var(--shell2));box-shadow:0 2px 5px #0004,inset 0 1px 0 #fff7;color:#0007;font-size:12px}
.ok.pressed{filter:brightness(.9)}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-3px,2px) rotate(-.6deg)}40%{transform:translate(3px,-2px) rotate(.6deg)}60%{transform:translate(-2px,1px)}80%{transform:translate(2px,-1px)}100%{transform:translate(0,0)}}
.device.shake{animation:shake .16s linear}
.device.shake.soft{animation-duration:.1s}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:380px;max-width:100%}
.panel h2{font-size:14px;margin:0 0 10px;color:var(--accent);letter-spacing:.5px}
.panel section{margin-bottom:20px}
.panel section:last-child{margin-bottom:0}
.pbtn{background:#2a2f3c;color:var(--text);border:1px solid #3a4050;border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;font-weight:600}
.pbtn:hover{background:#343a4a}
.small{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #fff3;cursor:pointer}
.sw button.sel{outline:2px solid var(--accent);outline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--accent);font-weight:700;width:96px}
kbd{background:#2a2f3c;border-radius:4px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>
<h1>MiniPod OS v2: Simulator</h1>
<div class="sub">240×320 portrait color, matching the real 2.4" ST7789 + ESP32-S3 build.</div>

<div class="wrap">
  <div class="device" id="device">
    <div class="jack" id="jack" title="Headphone jack"><span>🎧 jack</span><div class="plug"></div></div>
    <button class="power" id="power" title="Power on/off"></button><div class="powerLbl">power</div>
    <div class="screenWrap"><canvas id="scr"></canvas></div>
    <div class="brand" id="brand">MiniPod</div>
    <button class="menuBtn" data-k="menu">MENU</button>
    <div class="wheel">
      <button class="btn up" data-k="up">▲</button>
      <button class="btn down" data-k="down">▼</button>
      <button class="btn left" data-k="left">◀◀</button>
      <button class="btn right" data-k="right">▶▶</button>
      <button class="btn ok" data-k="ok">OK</button>
    </div>
    <div class="usb" title="USB-C"></div>
  </div>

  <input type="file" id="file" accept="audio/*,.mp3" multiple hidden>
</div>

<script>
// ================= DISPLAY: 240x320 RGB565 =================
const W=240,H=320;
const cv=document.getElementById('scr');cv.width=W;cv.height=H;
const g=cv.getContext('2d');const img=g.createImageData(W,H);const buf=new Uint32Array(img.data.buffer);
let CX0=0,CX1=W;
const now=()=>performance.now();
const q5=v=>((v>>3)*255/31)|0,q6=v=>((v>>2)*255/63)|0;
const pack=(r,gg,b)=>((255<<24)|(q5(b)<<16)|(q6(gg)<<8)|q5(r))>>>0;   // quantized like the real RGB565 panel
const hex=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const PC={};const C=h=>PC[h]??(PC[h]=pack(...hex(h)));
const lerpC=(a,b,t)=>pack(a[0]+(b[0]-a[0])*t|0,a[1]+(b[1]-a[1])*t|0,a[2]+(b[2]-a[2])*t|0);
function px(x,y,c){x|=0;y|=0;if(x<CX0||x>=CX1||y<0||y>=H)return;buf[y*W+x]=c}
function fill(x,y,w,h,c){x|=0;y|=0;w|=0;h|=0;const x0=Math.max(x,CX0),x1=Math.min(x+w,CX1),y0=Math.max(y,0),y1=Math.min(y+h,H);if(x1<=x0)return;for(let j=y0;j<y1;j++)buf.fill(c,j*W+x0,j*W+x1)}
function inset(j,h,r){if(!r)return 0;let d=0;if(j<r)d=r-j-0.5;else if(j>h-1-r)d=j-(h-1-r)+0.5;return d>0?Math.round(r-Math.sqrt(Math.max(0,r*r-d*d))):0}
function rfill(x,y,w,h,r,c){for(let j=0;j<h;j++){const i=inset(j,h,r);fill(x+i,y+j,w-2*i,1,c)}}
function rstroke(x,y,w,h,r,c){let prev=0;for(let j=0;j<h;j++){const i=inset(j,h,r);
  if(j===0||j===h-1)fill(x+i,y+j,w-2*i,1,c);else{const a=Math.min(i,prev),b=Math.max(i,prev);fill(x+a,y+j,b-a+1,1,c);fill(x+w-1-b,y+j,b-a+1,1,c)}prev=i}}
function grad(x,y,w,h,h1,h2,r=0){const a=hex(h1),b=hex(h2);for(let j=0;j<h;j++){const i=inset(j,h,r);fill(x+i,y+j,w-2*i,1,lerpC(a,b,h>1?j/(h-1):0))}}

const FONT=[0,0,0,0,0,0,0,95,0,0,0,7,0,7,0,20,127,20,127,20,36,42,127,42,18,35,19,8,100,98,54,73,86,32,80,0,8,7,3,0,0,28,34,65,0,0,65,34,28,0,42,28,127,28,42,8,8,62,8,8,0,128,112,48,0,8,8,8,8,8,0,0,96,96,0,32,16,8,4,2,62,81,73,69,62,0,66,127,64,0,114,73,73,73,70,33,65,73,77,51,24,20,18,127,16,39,69,69,69,57,60,74,73,73,49,65,33,17,9,7,54,73,73,73,54,70,73,73,41,30,0,0,20,0,0,0,64,52,0,0,0,8,20,34,65,20,20,20,20,20,0,65,34,20,8,2,1,89,9,6,62,65,93,89,78,124,18,17,18,124,127,73,73,73,54,62,65,65,65,34,127,65,65,65,62,127,73,73,73,65,127,9,9,9,1,62,65,65,81,115,127,8,8,8,127,0,65,127,65,0,32,64,65,63,1,127,8,20,34,65,127,64,64,64,64,127,2,28,2,127,127,4,8,16,127,62,65,65,65,62,127,9,9,9,6,62,65,81,33,94,127,9,25,41,70,38,73,73,73,50,3,1,127,1,3,63,64,64,64,63,31,32,64,32,31,63,64,56,64,63,99,20,8,20,99,3,4,120,4,3,97,89,73,77,67,0,127,65,65,65,2,4,8,16,32,0,65,65,65,127,4,2,1,2,4,64,64,64,64,64,0,3,7,8,0,32,84,84,120,64,127,40,68,68,56,56,68,68,68,40,56,68,68,40,127,56,84,84,84,24,0,8,126,9,2,24,164,164,156,120,127,8,4,4,120,0,68,125,64,0,32,64,64,61,0,127,16,40,68,0,0,65,127,64,0,124,4,120,4,120,124,8,4,4,120,56,68,68,68,56,252,24,36,36,24,24,36,36,24,252,124,8,4,4,8,72,84,84,84,36,4,4,63,68,36,60,64,64,32,124,28,32,64,32,28,60,64,48,64,60,68,40,16,40,68,76,144,144,144,124,68,100,84,76,68,0,8,54,65,0,0,0,119,0,0,0,65,54,8,0,2,1,2,4,2];
function glyph(x,y,code,s,c){let i=code-32;if(i<0||i>94)i=31;for(let col=0;col<5;col++){const b=FONT[i*5+col];if(!b)continue;for(let r=0;r<8;r++)if(b>>r&1)fill(x+col*s,y+r*s,s,s,c)}}
function text(x,y,str,s,c){str=String(str);for(let k=0;k<str.length;k++)glyph(x+k*6*s,y,str.charCodeAt(k),s,c);return str.length*6*s}
const tw=(str,s=2)=>Math.max(0,String(str).length*6*s-s);
function ctext(y,str,s,c){text(((W-tw(str,s))/2)|0,y,str,s,c)}
function fit(str,maxw,s=2){str=String(str);const n=Math.floor((maxw+s)/(6*s));return str.length<=n?str:str.slice(0,Math.max(0,n-1))+'.'}
function mtext(x,y,str,maxw,s,c,active=true,center=false){
  str=String(str);const w=tw(str,s);
  if(w<=maxw||!active){const t=fit(str,maxw,s);text(center?x+((maxw-tw(t,s))/2|0):x,y,t,s,c);return}
  const period=w+24*s,t=(now()/28)%(period+50),off=Math.floor(Math.max(0,t-50));
  const a=CX0,b=CX1;CX0=Math.max(0,x);CX1=Math.min(W,x+maxw);text(x-off,y,str,s,c);text(x-off+period,y,str,s,c);CX0=a;CX1=b}
function icon(x,y,rows,c,s=2){for(let r=0;r<8;r++){const b=rows[r];if(!b)continue;for(let k=0;k<8;k++)if(b>>(7-k)&1)fill(x+k*s,y+r*s,s,s,c)}}
function tri(cx,y,up,c){for(let i=0;i<5;i++)fill(cx-i,y+(up?i:4-i),2*i+1,1,c)}

const IC={
 note:[0x0E,0x0B,0x09,0x08,0x38,0x78,0x70,0x00],heart:[0x00,0x66,0xFF,0xFF,0x7E,0x3C,0x18,0x00],
 play:[0x00,0x60,0x78,0x7E,0x78,0x60,0x00,0x00],pause:[0x00,0x66,0x66,0x66,0x66,0x66,0x00,0x00],
 next:[0x00,0x92,0xDA,0xFE,0xDA,0x92,0x00,0x00],prev:[0x00,0x49,0x5B,0x7F,0x5B,0x49,0x00,0x00],
 clock:[0x3C,0x42,0x91,0x91,0x9D,0x81,0x42,0x3C],dice:[0xFF,0x81,0xA5,0x81,0xA5,0x81,0xFF,0x00],
 gear:[0x18,0x7E,0x66,0xC3,0xC3,0x66,0x7E,0x18],bass:[0x00,0x10,0x14,0x54,0x55,0x55,0x55,0x00],
 user:[0x3C,0x3C,0x3C,0x18,0x7E,0xFF,0xFF,0x00],spk:[0x10,0x32,0xF1,0xF5,0xF5,0xF1,0x32,0x10],
 phones:[0x3C,0x42,0x81,0x81,0xE7,0xE7,0xE7,0x00],lock:[0x18,0x24,0x24,0x7E,0x7E,0x66,0x7E,0x00],
 sd:[0x3E,0x2A,0x42,0x42,0x42,0x42,0x7E,0x00],brush:[0x03,0x07,0x0E,0x1C,0x38,0x70,0xC0,0x80],
 vol:[0x08,0x18,0xF8,0xF8,0xF8,0x18,0x08,0x00],search:[0x38,0x44,0x82,0x82,0x82,0x44,0x3E,0x07],globe:[0x3C,0x5A,0x99,0xFF,0x99,0x99,0x5A,0x3C],spot:[0x3C,0x7E,0xC3,0xBD,0xC3,0xB9,0x7E,0x3C]};
const AVATARS=[
 {n:'Star',r:[0x18,0x18,0xFF,0x7E,0x3C,0x66,0x42,0x00],c:'#ffc83d'},{n:'Heart',r:IC.heart,c:'#ff4d6d'},{n:'Music',r:IC.note,c:'#5aaeff'},
 {n:'Smile',r:[0x3C,0x42,0xA5,0x81,0xA5,0x99,0x42,0x3C],c:'#ffd23f'},{n:'Bolt',r:[0x0C,0x18,0x30,0x7E,0x0C,0x18,0x30,0x00],c:'#ffb000'},
 {n:'Crown',r:[0x00,0x99,0xDB,0xFF,0xFF,0x7E,0x7E,0x00],c:'#f5c542'},{n:'Cat',r:[0x42,0xE7,0xFF,0xDB,0xFF,0x66,0x3C,0x00],c:'#ff9a3d'},
 {n:'Ghost',r:[0x3C,0x7E,0xDB,0xDB,0xFF,0xFF,0xFF,0xA5],c:'#b8c4ff'},{n:'Rocket',r:[0x18,0x3C,0x24,0x3C,0x7E,0x7E,0xDB,0x81],c:'#ff6b5a'}];

// ================= THEMES =================
const THEMES=[
 {n:'Classic',bg:'#f3f4f7',text:'#1b1e26',muted:'#7a8090',line:'#dde0e7',bar1:'#fbfcfd',bar2:'#cdd2dc',barText:'#1b1e26',sel1:'#5aaeff',sel2:'#1f6fd6',selText:'#ffffff',accent:'#1f6fd6',panel:'#ffffff',warn:'#e5484d'},
 {n:'Midnight',bg:'#0f1218',text:'#e8ecf4',muted:'#7d8597',line:'#1f2430',bar1:'#2c3344',bar2:'#161a23',barText:'#e8ecf4',sel1:'#7d6dff',sel2:'#4a3bd6',selText:'#ffffff',accent:'#8b7dff',panel:'#1a1f2b',warn:'#ff6b6b'},
 {n:'LCD Green',bg:'#a7c43a',text:'#123d14',muted:'#3b6b2d',line:'#93b032',bar1:'#bcd65a',bar2:'#8fae2c',barText:'#123d14',sel1:'#3b6b2d',sel2:'#123d14',selText:'#c4dc6a',accent:'#123d14',panel:'#b7d14f',warn:'#7a1d12'},
 {n:'Sunset',bg:'#1d1220',text:'#ffe9d6',muted:'#b08a9c',line:'#2e1d33',bar1:'#ff8a5c',bar2:'#d9466a',barText:'#ffffff',sel1:'#ffb347',sel2:'#ff6f61',selText:'#2a1020',accent:'#ffb347',panel:'#2a1a2f',warn:'#ff5a5a'},
 {n:'Mono',bg:'#000000',text:'#ffffff',muted:'#8a8a8a',line:'#1c1c1c',bar1:'#2a2a2a',bar2:'#111111',barText:'#ffffff',sel1:'#ffffff',sel2:'#cfcfcf',selText:'#000000',accent:'#ffffff',panel:'#151515',warn:'#ff5a5a'}];
let T=null;
function useTheme(){const th=THEMES[(user&&user.s.theme)||0]||THEMES[0];if(T&&T.raw===th)return;T={raw:th};for(const k in th)if(k!=='n')T[k]=C(th[k])}

// ================= SAVE DATA =================
const KEY='minipod-sim-v1';
const freshDB=()=>({device:{name:'MiniPod',setup:false,bright:2,shell:0},users:[],last:null});
let DB=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.device&&Array.isArray(d.users))return d}catch(e){}return freshDB()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
let user=null;
const S=()=>user?user.s:{vol:10,bass:0,out:'spk',shuffle:false,repeat:0,theme:0};

// ================= AUDIO =================
const BASS=[{n:'Off',db:0,sub:0},{n:'Low',db:6,sub:3},{n:'Med',db:11,sub:6},{n:'MAX',db:16,sub:9},{n:'MEGA',db:20,sub:14}];
const audio=new Audio();audio.preload='auto';audio.crossOrigin='anonymous'; // lets online audio go through the bass/EQ chain
let actx,src,bassF,subF,spkF,gainN,comp,analyser,fdata;
function ensureAudio(){
  if(actx){if(actx.state==='suspended')actx.resume();return}
  actx=new (window.AudioContext||window.webkitAudioContext)();
  src=actx.createMediaElementSource(audio);
  bassF=actx.createBiquadFilter();bassF.type='lowshelf';bassF.frequency.value=150;
  subF=actx.createBiquadFilter();subF.type='peaking';subF.frequency.value=55;subF.Q.value=1.1;
  spkF=actx.createBiquadFilter();spkF.type='highpass';spkF.Q.value=0.7;
  gainN=actx.createGain();comp=actx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=5;comp.attack.value=0.01;comp.release.value=0.15;
  analyser=actx.createAnalyser();analyser.fftSize=128;fdata=new Uint8Array(64);
  src.connect(bassF);bassF.connect(subF);subF.connect(spkF);spkF.connect(gainN);gainN.connect(comp);comp.connect(analyser);analyser.connect(actx.destination);
  applyAudio();
}
function applyAudio(){
  const s=S();document.getElementById('jack').classList.toggle('on',s.out==='hp');
  if(!actx)return;const b=BASS[Math.min(s.bass,BASS.length-1)];
  bassF.gain.value=b.db;subF.gain.value=b.sub;spkF.frequency.value=s.out==='spk'?170:5;gainN.gain.value=Math.pow(s.vol/20,2)*0.9;
}
function applyVolume(){applyAudio();if(SP.player)SP.player.setVolume(Math.max(0.0001,Math.pow(S().vol/20,2)*0.9)).catch(()=>{})}
const P={lib:[],queue:[],qi:-1};
const cur=()=>P.queue[P.qi];
const isFav=n=>user&&user.favs.includes(n);
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function playQueue(list,idx,forceShuffle){
  let q=list.slice();
  if(forceShuffle){shuffleArr(q);idx=0}
  else if(S().shuffle){const st=q.splice(idx,1)[0];shuffleArr(q);q.unshift(st);idx=0}
  P.queue=q;P.qi=idx;loadCur();
}
// Spotify songs (t.uri) play through Spotify's own player; everything else through <audio> + the bass chain
const isSp=()=>!!(cur()&&cur().uri);
const plPaused=()=>isSp()?(!SP.state||SP.state.paused):audio.paused;
const plTime=()=>{if(isSp()){const s=SP.state;if(!s)return 0;return(s.position+(s.paused?0:performance.now()-SP.stateAt))/1000}return audio.currentTime||0};
const plDur=()=>isSp()?(SP.state?SP.state.duration/1000:0):(audio.duration||0);
function plSeek(t){if(isSp()){if(SP.player)SP.player.seek(Math.max(0,t*1000|0)).catch(()=>{})}else audio.currentTime=t}
function addRecent(t){remember(t);user.recent=[t.name,...user.recent.filter(n=>n!==t.name)].slice(0,15);save()}
function loadCur(){const t=cur();if(!t)return;addRecent(t);
  if(t.uri){audio.pause();spPlay(P.queue,P.qi);return}
  if(SP.player)SP.player.pause().catch(()=>{});
  audio.src=t.url;ensureAudio();audio.play().catch(()=>{})}
function nextTrack(auto){

function textEdit(o){const max=o.max||12;const chars=[...(o.init||'')].slice(0,max-1);chars.push(' ');
  return{wantsText:true,chars,cur:chars.length-1,
  draw(){body();header(o.title);rfill(6,62,228,52,10,T.panel);rstroke(6,62,228,52,10,T.line);
    const x0=12;this.chars.forEach((ch,i)=>{const x=x0+i*18;
      if(i===this.cur){rfill(x-2,70,19,32,4,blink()?T.accent:T.line);glyph(x+1,76,ch.charCodeAt(0),3,blink()?T.selText:T.text)}

    const cx=x0+this.cur*18+7;tri(cx,52,true,T.accent);tri(cx,120,false,T.accent);
    hints(150,['UP/DOWN  letter','LEFT/RIGHT  move','OK  done','MENU  back','or just type!'])},
  key(k,c){const ch=this.chars;
    if(k==='up'||k==='down'){const i=CS.indexOf(ch[this.cur]);ch[this.cur]=CS[(i+(k==='up'?1:-1)+CS.length)%CS.length]}
    else if(k==='right'){if(this.cur<max-1){this.cur++;if(this.cur>=ch.length)ch.push(' ')}}
    else if(k==='left'){if(this.cur>0){if(this.cur===ch.length-1&&ch[this.cur]===' ')ch.pop();this.cur--}}
    else if(k==='char'){if(CS.includes(c)){ch[this.cur]=c;if(this.cur<max-1){this.cur++;if(this.cur>=ch.length)ch.push(' ')}}}
    else if(k==='del'){if(this.cur===ch.length-1&&ch[this.cur]===' '&&this.cur>0){ch.pop();this.cur--;ch[this.cur]=' '}else ch[this.cur]=' '}
    else if(k==='ok'){const v=ch.join('').trim().replace(/\s+/g,' ');if(!v){toast('Type something!');return}o.done(v)}
    else if(k==='menu')pop();
  }}}

function searchScreen(mode='local'){const online=mode!=='local';return{wantsText:true,q:'',sel:-1,off:0,res:[],status:'',typedAt:0,lastQ:'',reqId:0,
  results(){const q=this.q.trim().toLowerCase();if(!q)return[];

  tick(){if(!online)return;const q=this.q.trim();
    if(q&&q!==this.lastQ&&now()-this.typedAt>600){this.lastQ=q;const id=++this.reqId;this.status='Searching...';
      onlineSearch(mode,q).then(L=>{if(id!==this.reqId)return;this.res=L;this.status='';this.sel=-1;this.off=0})
        .catch(e=>{if(id!==this.reqId)return;this.res=[];this.status=netErr(e,mode)})}},
  draw(){this.tick();body();header(mode==='itunes'?'Search songs':mode==='audius'?'Search Audius':mode==='spotify'?'Spotify':'Search');const R=this.results(),inBox=this.sel<0;
    rfill(6,30,228,30,8,T.panel);rstroke(6,30,228,30,8,inBox?T.accent:T.line);icon(12,37,IC.search,T.muted);

    if(inBox&&blink())fill(32+tw(shown)+(shown?3:0),36,2,18,T.accent);
    if(!this.q){hints(110,[online?'Search online for':'Type a song',online?'any song or artist':'or artist name','','Buttons: UP/DOWN','letter, RIGHT add,','LEFT delete'])}
    else if(this.status)this.status.split('|').forEach((l,i)=>ctext(120+i*22,l,2,T.muted));
    else if(!R.length)ctext(120,online&&this.q.trim()!==this.lastQ?'...':'No matches',2,T.muted);
    else{const RN=9,RH=26,TOP=66;if(this.sel>=R.length)this.sel=R.length-1;
      if(this.sel>=0){if(this.sel<this.off)this.off=this.sel;if(this.sel>=this.off+RN)this.off=this.sel-RN+1}
      this.off=Math.max(0,Math.min(this.off,R.length-RN));
      for(let r=0;r<RN;r++){const i=this.off+r;if(i>=R.length)break;const t=R[i],y=TOP+r*RH,s=i===this.sel;
        if(s)grad(4,y,W-8,RH-2,T.raw.sel1,T.raw.sel2,6);else fill(12,y+RH-1,W-24,1,T.line);
        mtext(12,y+6,online?showTitle(t)+' - '+disp(t.artist):showTitle(t),W-24,2,s?T.selText:T.text,s)}
      ctext(H-14,R.length+' found',1,T.muted)}
  },
  key(k,c){const R=this.results();
    if(k==='char'){this.q=(this.q+c).slice(0,30);this.sel=-1;this.off=0;this.typedAt=now();return}
    if(k==='menu'){pop();return}
    if(this.sel<0){
      if(k==='left'||k==='right'||k==='del'||k==='up'||k==='down')this.typedAt=now();
      if(k==='del'||k==='left'){this.q=this.q.slice(0,-1)}
      else if(k==='right'){if(this.q.length<30)this.q+='a'}
      else if(k==='up'||k==='down'){const L=' abcdefghijklmnopqrstuvwxyz0123456789';if(!this.q)this.q='a';
        const last=this.q.slice(-1).toLowerCase(),i=Math.max(0,L.indexOf(last));this.q=this.q.slice(0,-1)+L[(i+(k==='up'?1:-1)+L.length)%L.length]}
      else if(k==='ok'&&R.length){this.sel=0}
    }else{
      if(k==='up')this.sel=Math.max(0,this.sel-1);
      else if(k==='down')this.sel=Math.min(R.length-1,this.sel+1);
      else if(k==='left'||k==='del')this.sel=-1;
      else if(k==='ok'&&R[this.sel]){playQueue(R,this.sel);push(nowPlaying())}
      else if(k==='okLong'&&R[this.sel])toggleFav(R[this.sel].name,R[this.sel]);
    }
  }}}
function controlsScreen(){return{
  draw(){body();header('Controls');rfill(8,32,224,282,12,T.panel);
    [['UP/DOWN','move, volume'],['LEFT/RIGHT','back, prev/next'],['HOLD LEFT/RIGHT','rewind/forward'],['OK','select, play'],['HOLD OK','favorite'],['MENU','back'],['KEYBOARD','arrows,Enter,Esc']]
      .forEach(([a,b],i)=>{text(16,40+i*39,a,2,T.accent);text(28,58+i*39,b,2,T.text)})},
  key(k){if(k==='menu'||k==='left'||k==='ok')pop()}}}
function settingsScreen(){return listScreen({title:'Settings',items:()=>[
  {label:'Theme',icon:IC.brush,value:THEMES[S().theme||0].n,sub:true,act:()=>push(themeScreen())},
  {label:'Brightness',value:['Low','Med','High'][DB.device.bright],act(){DB.device.bright=(DB.device.bright+1)%3;save()}},
  {label:'Swear Filter',value:FILTERS[swearMode()],act(){S().filter=(swearMode()+1)%3;save();
    toast(['Filter off','Swears censored|f*** style','Clean only:|explicit songs|hidden'][S().filter])}},
  {label:'Shuffle',value:S().shuffle?'On':'Off',act(){S().shuffle=!S().shuffle;save()}},
  {label:'Repeat',value:['Off','All','One'][S().repeat],act(){S().repeat=(S().repeat+1)%3;save()}},
  {label:'My Account',icon:AVATARS[user.icon].r,iconC:AVATARS[user.icon].c,sub:true,act:()=>push(accountScreen())},
  {label:'Add User',icon:IC.user,sub:true,act(){if(DB.users.length>=6)return toast('Max 6 users');const base=stack.length;
    newUserFlow(u=>{DB.users.push(u);save();stack.length=base;toast('Added '+u.name+'!')})}},
  {label:'Device Name',value:DB.device.name,act(){push(textEdit({title:'Device name',init:DB.device.name,done(v){DB.device.name=v;save();pop();toast('Renamed!')}}))}},
  {label:'Load Music',icon:IC.sd,value:P.lib.length+' songs',act(){document.getElementById('file').click()}},
  {label:'Shell Color',value:SHELL_NAMES[DB.device.shell]||'White',act(){DB.device.shell=(DB.device.shell+1)%SHELLS.length;save();applyShell()}},
  {label:'Battery',value:Math.round(battery)+'%',act:chargeBattery},
  {label:'Controls',sub:true,act:()=>push(controlsScreen())},
  {label:'About',sub:true,act:()=>push(aboutScreen())},
  {label:'Factory Reset',act:()=>push(confirmScreen('Erase EVERYTHING?|All users and|settings go away',factoryReset))}]})}
function accountScreen(){return listScreen({title:()=>user.name,items:()=>[
  {label:'Rename',value:user.name,act(){push(textEdit({title:'New name',init:user.name,done(v){user.name=v;save();pop();toast('Hi '+v+'!')}}))}},
  {label:'Icon',ricon:AVATARS[user.icon].r,riconC:AVATARS[user.icon].c,act(){push(iconPick({title:'Pick icon',init:user.icon,done(i){user.icon=i;save();pop()}}))}},
  {label:user.pin?'Change PIN':'Set PIN',icon:IC.lock,act(){const base=stack.length;setPinFlow(p=>{user.pin=p;save();stack.length=base;toast('PIN saved!')})}},
  ...(user.pin?[{label:'Remove PIN',act(){user.pin=null;save();toast('PIN removed')}}]:[]),
  {label:'Delete Account',act(){if(DB.users.length<2)return toast("Can't delete|the only user");
    push(confirmScreen('Delete '+fit(user.name,120)+'?|Favorites will be|gone forever',()=>{DB.users=DB.users.filter(u=>u!==user);save();stopMusic();goLogin(true)}))}}]})}
function aboutScreen(){return{
  draw(){body();header('About');rfill(12,40,216,240,12,T.panel);
    [[DB.device.name,T.text],['Firmware v0.2 (sim)',T.muted],['',0],['Songs: '+P.lib.length,T.text],['Users: '+DB.users.length,T.text],['',0],['ESP32-S3 N8R8',T.muted],['2.4" ST7789',T.muted],['240x320 RGB565',T.muted]]
      .forEach(([l,c],i)=>{if(l)text(24,54+i*24,fit(l,192),2,c)})},
  key(k){if(k==='menu'||k==='left')pop()}}}
function factoryReset(){try{localStorage.removeItem(KEY)}catch(e){}DB=freshDB();stopMusic();applyShell();boot()}

// ================= POWER / LOOP =================
let power=true,lastInput=now(),dimmed=false;
function powerToggle(){
  if(power){stopMusic();bootId++;replace({draw(){fill(0,0,W,H,C('#000000'));ctext(150,'Bye!',3,C('#ffffff'))},key(){}});setTimeout(()=>{power=false;stack=[];user=null},700)}
  else{power=true;lastInput=now();boot()}
}
document.getElementById('power').onclick=powerToggle;
setInterval(()=>{
  if(charging)return;if(!power)return;battery=Math.max(0,battery-(plPaused()?0.5:1));
  if(battery===10)toast('Low battery!');if(battery<=0&&power)powerToggle();
},30000);
function chargeBattery(){charging=true;toast('Charging...');setTimeout(()=>{battery=100;charging=false},3000)}

let lastFilter='';
function frame(){
  dimmed=power&&now()-lastInput>20000;
  if(power){useTheme();const s=topS();if(s)s.draw();drawToast()}else buf.fill(C('#000000'));
  g.putImageData(img,0,0);
  const f=power?`brightness(${[0.55,0.8,1][DB.device.bright]*(dimmed?0.35:1)})`:'brightness(0)';
  if(f!==lastFilter){cv.style.filter=f;lastFilter=f}
  const b=document.getElementById('brand');if(b.textContent!==DB.device.name)b.textContent=DB.device.name;
  requestAnimationFrame(frame);
}

// ================= INPUT: tap / hold =================
function input(k,c){
  if(!power)return;
  const wasDim=dimmed;lastInput=now();if(wasDim){dimmed=false;return}
  const s=topS();if(s&&s.key)s.key(k,c);
}
const held={};
function btnEl(k){return document.querySelector(`[data-k="${k}"]`)}
function pressStart(k){
  if(held[k])return;const h=held[k]={long:false,nav:false};btnEl(k)?.classList.add('pressed');
  const s=topS();
  if(k==='ok'){h.t=setTimeout(()=>{h.long=true;input('okLong')},600);return}
  if((k==='left'||k==='right')&&s&&s.holdNav){h.nav=true;
    h.t=setTimeout(function r(){h.long=true;input(k==='left'?'seekL':'seekR');h.t=setTimeout(r,120)},350);return}
  input(k);if(k!=='menu')h.t=setTimeout(function r(){input(k);h.t=setTimeout(r,110)},420);
}
function pressEnd(k){
  const h=held[k];if(!h)return;delete held[k];clearTimeout(h.t);btnEl(k)?.classList.remove('pressed');
  if(k==='ok'&&!h.long)input('ok');
  else if(h.nav&&!h.long)input(k);
}
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);pressStart(k)});
  b.addEventListener('pointerup',()=>pressEnd(k));b.addEventListener('pointercancel',()=>pressEnd(k));
});
const KMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Escape:'menu',Enter:'ok',' ':'ok'};
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const s=topS();
  if(s&&s.wantsText&&e.key.length===1){e.preventDefault();input('char',e.key);return}
  if(s&&s.wantsDigits&&/^[0-9]$/.test(e.key)){e.preventDefault();input('char',e.key);return}
  if(e.key==='Backspace'){e.preventDefault();input(s&&(s.wantsText||s.wantsDigits)?'del':'menu');return}
  const k=KMAP[e.key];if(!k)return;e.preventDefault();if(e.repeat)return;pressStart(k);
});
addEventListener('keyup',e=>{const k=KMAP[e.key];if(k)pressEnd(k)});
addEventListener('blur',()=>Object.keys(held).forEach(k=>{const h=held[k];delete held[k];clearTimeout(h.t);btnEl(k)?.classList.remove('pressed')}));

// ================= LOAD MUSIC / SHELL (in Settings) =================
const fileIn=document.getElementById('file');
fileIn.onchange=()=>{
  const fs=[...fileIn.files].filter(f=>f.type.startsWith('audio')||/\.(mp3|wav|ogg|m4a)$/i.test(f.name));
  for(const f of fs){const name=f.name.replace(/\.[^.]+$/,'');if(!P.lib.some(t=>t.name===name))P.lib.push(mkSong(name,URL.createObjectURL(f)))}
  P.lib.sort((a,b)=>(a.name.includes('(demo)')-b.name.includes('(demo)'))||a.title.localeCompare(b.title));
  if(fs.length)toast('Found '+fs.length+' song'+(fs.length>1?'s':'')+'!');fileIn.value='';
};
const SHELL_NAMES=['White','Black','Red','Blue','Purple','Green','Yellow'];
const SHELLS=[['#ececf1','#c8c9d2','#f8f8fb','#9a9caa'],['#41444d','#1d1f25','#2b2d34','#8d92a0'],['#ef5a5f','#a8262b','#f6f6f8','#b0535a'],
  ['#5b9bff','#2459b8','#f6f6f8','#4d6fae'],['#a77bf3','#5f36b0','#f6f6f8','#7a5bb0'],['#4fd18a','#1f8a4e','#f6f6f8','#3f8a63'],['#ffcf4a','#d49a12','#fffaf0','#b58a2a']];
function applyShell(){const v=SHELLS[DB.device.shell]||SHELLS[0],r=document.documentElement.style;
  r.setProperty('--shell',v[0]);r.setProperty('--shell2',v[1]);r.setProperty('--wheel',v[2]);r.setProperty('--wheelText',v[3])}

applyShell();boot();frame();
spHandleRedirect().then(()=>{if(SP.tok)spInit();if(SP.toast)setTimeout(()=>toast(SP.toast,2200),1900)});
</script>
